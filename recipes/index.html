<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="Recipe book site logo">
        <h1>RecipeBook</h1>
    </header>
    <main>
        <form action="/search" method="get" id="search-bar">
            <input type="search" placeholder="Find a Recipe">
            <button type="submit"><img src="images/search.svg" alt="Search button"></button>
        </form>
        <section class="recipe">
            <img src="images/chicken-curry.webp" alt="Chicken curry with white rice">
            <div class="tags">
                <div class="recipe-tag">chicken</div>
                <div class="recipe-tag">entree</div>
                <div class="recipe-tag">Indian</div>
            </div>
            <h2 class="recipe-name">Chicken Curry</h2>
            <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
            >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
            <p class="recipe-description hidden">Quick and easy Chicken curry recipe made with easy to find ingredients.</p>
        </section>
    </main>
    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a class="attribution" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
</body>
</html>
